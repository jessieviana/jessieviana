<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-label="// stack">
  <title>// stack</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#190b26"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity="0.22"/></pattern>
    <text id="ttl" x="28" y="43" font-size="28" font-weight="700" letter-spacing="2" font-family="Courier New, Courier, monospace">// stack</text>
  </defs>
  <style>
    .g1 { animation: gl1 6.7s steps(1, end) infinite; mix-blend-mode: screen; }
    .g2 { animation: gl2 6.7s steps(1, end) infinite; mix-blend-mode: screen; }
    .main { animation: fl 6.7s steps(1, end) infinite; }
    .cur { animation: bl 1s steps(1, end) infinite; }
    @keyframes gl1 {
      0%, 84% { transform: translate(-1.5px, 0); clip-path: inset(0 0 0 0); }
      85% { transform: translate(-7px, 1px); clip-path: inset(10% 0 60% 0); }
      87% { transform: translate(6px, -2px); clip-path: inset(55% 0 12% 0); }
      89% { transform: translate(-4px, 2px); clip-path: inset(30% 0 40% 0); }
      91% { transform: translate(3px, 0); clip-path: inset(68% 0 6% 0); }
      93%, 100% { transform: translate(-1.5px, 0); clip-path: inset(0 0 0 0); }
    }
    @keyframes gl2 {
      0%, 84% { transform: translate(1.5px, 0); clip-path: inset(0 0 0 0); }
      85% { transform: translate(7px, -1px); clip-path: inset(58% 0 10% 0); }
      87% { transform: translate(-6px, 2px); clip-path: inset(14% 0 56% 0); }
      89% { transform: translate(5px, -2px); clip-path: inset(42% 0 28% 0); }
      91% { transform: translate(-3px, 0); clip-path: inset(6% 0 74% 0); }
      93%, 100% { transform: translate(1.5px, 0); clip-path: inset(0 0 0 0); }
    }
    @keyframes fl {
      0%, 89% { opacity: 1; }
      90% { opacity: 0.75; }
      91% { opacity: 1; }
      92% { opacity: 0.6; }
      93%, 100% { opacity: 1; }
    }
    @keyframes bl {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
.pulse { animation: pl 4.67s linear infinite; }
    @keyframes pl { from { transform: translateX(0); } to { transform: translateX(1160px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <rect width="1000" height="64" fill="url(#bg)"/>
  <rect x="0" y="0" width="6" height="64" fill="#ff2bd6"/>
  <rect x="6" y="0" width="2" height="64" fill="#00e5ff" fill-opacity="0.6"/>
  <use href="#ttl" class="g1" fill="#00e5ff"/>
  <use href="#ttl" class="g2" fill="#ff2bd6"/>
  <use href="#ttl" class="main" fill="#ffffff"/>
  <text x="976" y="40" text-anchor="end" font-size="14" letter-spacing="2" fill="#9fb3d9" font-family="Courier New, Courier, monospace">[ 04 ]<tspan class="cur">_</tspan></text>
  <line x1="0" y1="62" x2="1000" y2="62" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="2"/>
  <rect class="pulse" x="-160" y="61" width="160" height="3" fill="url(#pulse)"/>
  <rect width="1000" height="64" fill="url(#scan)"/>
</svg>

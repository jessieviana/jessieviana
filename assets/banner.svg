    <rect x="722" y="165" width="6" height="8"/><rect x="744" y="165" width="6" height="8"/><rect x="764" y="188" width="6" height="8"/>
    <rect x="728" y="214" width="6" height="8"/><rect x="752" y="240" width="6" height="8"/>
    <rect x="922" y="195" width="6" height="8"/><rect x="946" y="195" width="6" height="8"/><rect x="972" y="195" width="6" height="8"/>
    <rect x="932" y="222" width="6" height="8"/><rect x="960" y="248" width="6" height="8"/>

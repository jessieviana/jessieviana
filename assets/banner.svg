<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Jéssica Viana — Cloud, Amazon Connect e Segurança">
  <title>Jéssica Viana — Cloud, Amazon Connect e Segurança</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#190b26"/>
    </linearGradient>
    <radialGradient id="glowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1a6fff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.22"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <text id="ttl" x="500" y="168" text-anchor="middle" font-size="60" font-weight="700" letter-spacing="6" font-family="Courier New, Courier, monospace">JÉSSICA VIANA</text>
  </defs>
  <style>
    .g1 { animation: gl1 5s steps(1, end) infinite; mix-blend-mode: screen; }
    .g2 { animation: gl2 5s steps(1, end) infinite; mix-blend-mode: screen; }
    .main { animation: fl 7s steps(1, end) infinite; }
    .wa { animation: fk 3.3s linear infinite; }
    .wb { animation: fk 4.7s linear infinite -1.2s; }
    .wc { animation: fk 6.1s linear infinite -2.6s; }
    .cur { animation: bl 1s steps(1, end) infinite; }
    .sweep { animation: sw 6s linear infinite; }
    .cloud { animation: fc 6s ease-in-out infinite alternate; }
    @keyframes gl1 {
      0%, 88% { transform: translate(-2px, 0); clip-path: inset(0 0 0 0); }
      89% { transform: translate(-9px, 1px); clip-path: inset(8% 0 62% 0); }
      91% { transform: translate(7px, -2px); clip-path: inset(52% 0 14% 0); }
      93% { transform: translate(-5px, 2px); clip-path: inset(28% 0 42% 0); }
      95% { transform: translate(4px, 0); clip-path: inset(70% 0 5% 0); }
      97%, 100% { transform: translate(-2px, 0); clip-path: inset(0 0 0 0); }
    }
    @keyframes gl2 {
      0%, 88% { transform: translate(2px, 0); clip-path: inset(0 0 0 0); }
      89% { transform: translate(8px, -1px); clip-path: inset(60% 0 10% 0); }
      91% { transform: translate(-7px, 2px); clip-path: inset(12% 0 58% 0); }
      93% { transform: translate(6px, -2px); clip-path: inset(40% 0 30% 0); }
      95% { transform: translate(-4px, 0); clip-path: inset(5% 0 75% 0); }
      97%, 100% { transform: translate(2px, 0); clip-path: inset(0 0 0 0); }
    }
    @keyframes fl {
      0%, 93% { opacity: 1; }
      94% { opacity: 0.75; }
      95% { opacity: 1; }
      96% { opacity: 0.6; }
      97%, 100% { opacity: 1; }
    }
    @keyframes fk {
      0%, 100% { opacity: 0.95; }
      38% { opacity: 0.95; }
      40% { opacity: 0.15; }
      43% { opacity: 0.9; }
      68% { opacity: 0.9; }
      70% { opacity: 0.25; }
      72% { opacity: 0.95; }
    }
    @keyframes bl {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes sw {
      0% { transform: translateY(0); }
      100% { transform: translateY(400px); }
    }
    @keyframes fc {
      from { transform: translateY(0); }
      to { transform: translateY(-5px); }
    }
    @keyframes rainfall { from { transform: translate(0, -60px); } to { transform: translate(-30px, 380px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .rain { display: none; }
    }
  </style>


    <g fill="#1a2340" fill-opacity="0.85" stroke="#2a3a6a" stroke-width="1">
      <circle cx="468" cy="62" r="20"/>
      <circle cx="500" cy="50" r="26"/>
      <circle cx="534" cy="62" r="20"/>
    </g>
    <rect x="466" y="60" width="70" height="22" fill="#1a2340" fill-opacity="0.85"/>

  <!-- título com glitch -->
  <use href="#ttl" class="g1" fill="#00e5ff"/>
  <use href="#ttl" class="g2" fill="#ff2bd6"/>
  <use href="#ttl" class="main" fill="#ffffff"/>

  <text x="500" y="208" text-anchor="middle" font-size="17" fill="#00e5ff" font-family="Courier New, Courier, monospace">jessieviana@cloud-defender:~$ ./cloud --connect --security<tspan class="cur">█</tspan></text>
  <text x="500" y="244" text-anchor="middle" font-size="13" letter-spacing="4" fill="#9fb3d9" font-family="Courier New, Courier, monospace">AWS CERTIFIED DEVELOPER · CLOUD PRACTITIONER · CONNECT (EM FORMAÇÃO)</text>

  <!-- HUD -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" width="320" height="190" role="img" aria-label="blue-team-lab: Infra corporativa simulada e segura, com alertas de login SSH monitorados no Graylog. (A PUBLICAR)">
  <title>blue-team-lab</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#190b26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6a8cff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#6a8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a6fff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity="0.22"/></pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <text id="ttl" x="20" y="42" font-size="18" font-weight="700" font-family="Courier New, Courier, monospace">blue-team-lab</text>
  </defs>
  <style>
    .g1 { animation: gl1 5.8s steps(1, end) infinite; mix-blend-mode: screen; }
    .g2 { animation: gl2 5.8s steps(1, end) infinite; mix-blend-mode: screen; }
    .main { animation: fl 5.8s steps(1, end) infinite; }
    .cur { animation: bl 1s steps(1, end) infinite; }
    @keyframes gl1 {
      0%, 84% { transform: translate(-1.5px, 0); clip-path: inset(0 0 0 0); }
      85% { transform: translate(-7px, 1px); clip-path: inset(10% 0 60% 0); }
      87% { transform: translate(6px, -2px); clip-path: inset(55% 0 12% 0); }
      89% { transform: translate(-4px, 2px); clip-path: inset(30% 0 40% 0); }
      91% { transform: translate(3px, 0); clip-path: inset(68% 0 6% 0); }
      93%, 100% { transform: translate(-1.5px, 0); clip-path: inset(0 0 0 0); }
    }
    @keyframes gl2 {
      0%, 84% { transform: translate(1.5px, 0); clip-path: inset(0 0 0 0); }
      85% { transform: translate(7px, -1px); clip-path: inset(58% 0 10% 0); }
      87% { transform: translate(-6px, 2px); clip-path: inset(14% 0 56% 0); }
      89% { transform: translate(5px, -2px); clip-path: inset(42% 0 28% 0); }
      91% { transform: translate(-3px, 0); clip-path: inset(6% 0 74% 0); }
      93%, 100% { transform: translate(1.5px, 0); clip-path: inset(0 0 0 0); }
    }
    @keyframes fl {
      0%, 89% { opacity: 1; }
      90% { opacity: 0.75; }
      91% { opacity: 1; }
      92% { opacity: 0.6; }
      93%, 100% { opacity: 1; }
    }
    @keyframes bl {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
.sweep { animation: sw 4.6s linear infinite; }
    @keyframes sw { from { transform: translateY(0); } to { transform: translateY(230px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <rect width="320" height="190" fill="url(#bg)"/>
  <rect width="320" height="190" fill="url(#grid)"/>
  <ellipse cx="260" cy="20" rx="190" ry="110" fill="url(#glow)"/>
  <rect x="1" y="1" width="318" height="188" fill="none" stroke="#1b2644" stroke-width="1"/>
  <rect x="0" y="0" width="320" height="3" fill="#6a8cff"/>
  <use href="#ttl" class="g1" fill="#00e5ff"/>
  <use href="#ttl" class="g2" fill="#ff2bd6"/>
  <use href="#ttl" class="main" fill="#ffffff"/>
  <text x="20" y="62" font-size="11" letter-spacing="2" fill="#6a8cff" font-family="Courier New, Courier, monospace">VLANS · DNS · LDAP · ANSIBLE</text>
  <text x="20" y="92" font-size="13" fill="#cbd5f5" font-family="Courier New, Courier, monospace">Infra corporativa simulada e</text>
  <text x="20" y="112" font-size="13" fill="#cbd5f5" font-family="Courier New, Courier, monospace">segura, com alertas de login</text>
  <text x="20" y="132" font-size="13" fill="#cbd5f5" font-family="Courier New, Courier, monospace">SSH monitorados no Graylog.</text>
  <text x="20" y="170" font-size="12" letter-spacing="2" fill="#6a8cff" font-family="Courier New, Courier, monospace"><tspan class="cur">●</tspan> A PUBLICAR</text>
  <g fill="none" stroke="#6a8cff" stroke-opacity="0.7" stroke-width="2">
    <path d="M298 150V176H272"/>
  </g>
  <rect width="320" height="190" fill="url(#scan)"/>
  <rect class="sweep" x="0" y="-40" width="320" height="40" fill="url(#bar)"/>
</svg>
